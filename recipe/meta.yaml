{% set name = "pyvkfft" %}
{% set version = "2025.1.1" %}

# Context: The default context value "None" is used when cuda_compiler_version is not
# defined in the matrix configuration (.ci_support/*.yaml files). When a matrix
# file specifies cuda_compiler_version (e.g., "13.0"), that value takes precedence
# over this default, allowing the same recipe to build with or without CUDA.
context:
  cuda_compiler_version: None

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pyvkfft-{{ version }}.tar.gz
  sha256: 359648e089cac0e3c82fc685dc7b8a9e1a249b338dcd7c94677d68207c9842bb
  patches:
    - conda_libraries.diff

build:
  number: 1
  entry_points:
    - pyvkfft-test = pyvkfft.scripts.pyvkfft_test:main
  script:
    # CUDA 13 moved the win-64 import libraries to Library/lib/x64 to support
    # cross-compiling, cuda-nvcc's activate.bat sets INCLUDE but never LIB, unlike its
    # activate.sh counterpart, so the host prefix is missing from the link path.
    # https://github.com/conda-forge/cuda-nvcc-feedstock/issues/47
    - set "LIB=%LIBRARY_LIB%\x64;%LIB%"      # [win and cuda_compiler_version != "None"]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  ignore_run_exports_from:
    - cuda-nvrtc-dev                         # [cuda_compiler_version != "None"]
  ignore_run_exports:
    - cuda-version                           # [cuda_compiler_version != "None"]
  missing_dso_whitelist:
    # The CUDA driver must come from the system at runtime.
    - "*/libcuda.so.1"                       # [linux and cuda_compiler_version != "None"]
    # ocl-icd-system symlinks the system's copy at runtime.
    - "*/libOpenCL.so.1"                     # [linux]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - setuptools                             # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}                 # [cuda_compiler_version != "None"]
  host:
    - pip
    - python
    - ocl-icd-system                        # [linux]
    - khronos-opencl-icd-loader             # [win or osx]
    - ocl_icd_wrapper_apple                 # [osx]
    - cuda-version {{ cuda_compiler_version }}  # [cuda_compiler_version != "None"]
    - cuda-nvrtc-dev                        # [cuda_compiler_version != "None"]
    - setuptools
  run:
    - numpy
    - psutil
    - pyopencl
    - python
    - __cuda                                # [cuda_compiler_version != "None"]
    - {{ pin_compatible('cuda-version', max_pin='x', min_pin='x') }}  # [cuda_compiler_version != "None"]
    - cuda-nvrtc                            # [cuda_compiler_version != "None"]
  run_constrained:
    - __cuda <0.0a0                         # [cuda_compiler_version == "None"]

test:
  imports:
    - pyvkfft
    - pyvkfft.base
    - pyvkfft.test._test_opencl_lib
    - pyvkfft.test._test_cuda_lib           # [cuda_compiler_version != "None"]
#  commands:
#    - pyvkfft-test --help

about:
  home: https://github.com/vincefn/pyvkfft
  summary: Python wrapper for the CUDA and OpenCL backends of VkFFT, providing GPU FFT for PyCUDA, PyOpenCL and CuPy
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - vincefn
    - isuruf
